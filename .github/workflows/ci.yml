name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ownership check
        if: github.event_name == 'pull_request'
        run: node scripts/check-owners.mjs --base origin/${{ github.base_ref }} --branch ${{ github.head_ref }}
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: No fixtures in production build
        run: pnpm check:no-fixtures

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the dev server (fixtures on)
        run: |
          cp apps/worker/.dev.vars.example apps/worker/.dev.vars
          pnpm db:migrate:local
          PORT=8788 pnpm dev > dev-server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8788/api/health && break; sleep 2; done
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8788
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            e2e/test-results
            dev-server.log